name: Daily DAM Sync

# Invoke the `sync-scores` Supabase Edge Function on a schedule so new
# scoring results land in the DB without the user having to open the app.
#
# Required repository secrets:
#   SUPABASE_URL              e.g. https://<project>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY the service_role key (sensitive; do NOT expose
#                             it to the browser — this workflow runs server-
#                             side only)
#   TARGET_USER_ID            UUID of the user whose cdmCardNo should be
#                             synced. MVP is single-user; a multi-user
#                             rewrite would iterate over profiles on the
#                             Supabase side instead and drop this secret.
#
# Optional repository secrets:
#   DISCORD_WEBHOOK_URL       If set, a message is POSTed here whenever the
#                             sync job fails (cron or manual). Leave unset to
#                             silence notifications — the step will no-op.

on:
  schedule:
    # Every day at 03:00 UTC (= 12:00 JST). cron timezones are UTC regardless
    # of repo settings; keep the mapping comment accurate if this changes.
    - cron: "0 3 * * *"
  # Manual trigger for smoke-testing from the Actions tab.
  workflow_dispatch:

concurrency:
  # Cancel the previous run if it's still ongoing when a new one fires.
  group: sync-scores
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Invoke sync-scores Edge Function
        id: invoke
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USER_ID: ${{ secrets.TARGET_USER_ID }}
        run: |
          set -eu
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SERVICE_ROLE_KEY}" ] || [ -z "${USER_ID}" ]; then
            echo "::error::Missing one of SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY / TARGET_USER_ID"
            exit 2
          fi

          # Capture response and status; curl --fail turns non-2xx into exit 22.
          http_code=$(curl -sS -o /tmp/sync.out -w '%{http_code}' \
            -X POST "${SUPABASE_URL}/functions/v1/sync-scores" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"userId\":\"${USER_ID}\",\"trigger\":\"cron\"}")

          echo "HTTP ${http_code}"
          echo "--- response body ---"
          cat /tmp/sync.out
          echo

          # Expose the last ~500 chars of the body to later steps for the
          # failure notification. Multi-line outputs need the << heredoc
          # syntax; truncate to keep Discord's 2000-char limit in mind.
          {
            echo "http_code=${http_code}"
            echo "body<<EOF"
            tail -c 500 /tmp/sync.out
            echo
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          if [ "${http_code}" -lt 200 ] || [ "${http_code}" -ge 300 ]; then
            echo "::error::Edge Function returned HTTP ${http_code}"
            exit 1
          fi

      - name: Notify Discord on failure
        # Only runs when a previous step fails. The `DISCORD_WEBHOOK_URL` is
        # optional — if unset, `curl` hits an empty URL and fails, so we
        # short-circuit first. `continue-on-error: true` keeps the workflow
        # itself marked as failed (so the GH UI still shows the red X).
        if: ${{ failure() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HTTP_CODE: ${{ steps.invoke.outputs.http_code }}
          BODY: ${{ steps.invoke.outputs.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi

          # Build the JSON payload with jq so that body contents with quotes/
          # newlines are escaped safely. Discord truncates content > 2000
          # chars; we build a compact message and include a link to the run.
          payload=$(jq -n \
            --arg code "${HTTP_CODE:-n/a}" \
            --arg body "${BODY:-<no body captured>}" \
            --arg url "${RUN_URL}" \
            '{
              username: "karaoke-sync",
              content: ("🚨 DAM 同期 cron が失敗しました\nHTTP: " + $code + "\n" + $url + "\n```\n" + ($body | .[0:1500]) + "\n```")
            }')

          curl -sS -X POST "${DISCORD_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -d "${payload}" \
            -o /dev/null -w "Discord webhook HTTP %{http_code}\n"
