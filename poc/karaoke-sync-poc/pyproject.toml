[project]
name = "karaoke-sync-poc"
version = "0.1.0"
description = "DAM scoring Ai sync PoC: fetch scoring history and load into Supabase"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "lxml>=5.1.0",
    "xmltodict>=0.13.0",
    "supabase>=2.5.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",        # Retry with exponential backoff
    "structlog>=24.1.0",      # Structured logging
    "click>=8.1.0",           # CLI framework
    "pydantic>=2.6.0",        # Data validation
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
